# Build the packages and publish the apk repository to GitHub Pages behind
# tsx-aports.unexceptional.net.
#
#   build           runs on a push to main (only when packages, scripts or this
#                   file change), on manual runs, and on pull requests.
#                   It restores the published tree (scripts/carry-forward.py).
#                   It builds only the new versions (scripts/build.sh
#                   --skip-existing). It then re-indexes and signs the tree
#                   (scripts/index.sh --keep 2). A pull request builds with a
#                   throwaway key and publishes nothing.
#   deploy          publishes the tree that `build` assembled.
#   chromium-watch  runs on a schedule. It checks Alpine v3.24 armv7 for a
#                   newer chromium and opens a pull request that changes
#                   the pin.
#
# Runners. The jobs that run ARM code (build and chromium-watch) run on the
# hosted arm64 runner ubuntu-24.04-arm. This runner runs the armv7 and aarch64
# containers of scripts/build.sh and scripts/index.sh natively
# (docker --platform linux/arm/v7 and linux/arm64). The jobs need no qemu-user
# binfmt (docker/setup-qemu-action). The other jobs run no ARM code and stay
# on ubuntu-latest.
#
# These settings must exist once, outside this file:
#   - The secret TSX_APORTS_PRIVKEY holds the signing key, base64-encoded.
#     The key itself is never committed.
#   - Settings > Pages > source "GitHub Actions", and the custom domain.
#   - Settings > Actions > General > "Allow GitHub Actions to create and
#     approve pull requests" (for chromium-watch only).
#
# First deploy: the live site is empty, so nothing is carried forward, and the
# kernel packages are missing (their release bundles may not exist yet).
# Before the first push to main, upload a tarball of a published tree as the
# release asset named below (README.md "CI"). Or start a manual run with the
# seed_url input. Later runs restore the live site instead.
name: build

on:
  push:
    branches: [main]
    paths: ['common/**', 'xx60/**', 'scripts/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['common/**', 'xx60/**', 'scripts/**', '.github/workflows/build.yml']
  schedule:
    # chromium-watch and wlroots-watch use this schedule. The time is UTC, once a day.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      seed_url:
        description: 'Tarball (URL) of a published tree to start from instead of the live site (the first deploy)'
        required: false
        default: ''

# A publish is never cancelled part-way. A pull-request build does not wait
# for a publish and does not block one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'tsx-aports-publish' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://tsx-aports.unexceptional.net
  SITE_DOMAIN: tsx-aports.unexceptional.net

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide if this run publishes
        id: mode
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        if: steps.mode.outputs.publish == 'true'
        env:
          KEY_B64: ${{ secrets.TSX_APORTS_PRIVKEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          # The key file must have the name of the committed public key
          # (tsx-mainline-<id>.rsa). The index signature uses this name, and
          # a panel finds the key in /etc/apk/keys by this name.
          PUB=$(ls common/tsx-keys/*.rsa.pub)
          KEYNAME=$(basename "$PUB" .pub)
          [ -n "$KEY_B64" ] || { echo "::error::secret TSX_APORTS_PRIVKEY is not set"; exit 1; }
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/keys/$KEYNAME"
          openssl rsa -in "$RUNNER_TEMP/keys/$KEYNAME" -pubout -out "$RUNNER_TEMP/keys/$KEYNAME.pub"
          # The secret must be the key for the committed public key. If it is
          # not, panels reject every index that this run signs.
          [ "$(openssl rsa -pubin -in "$PUB" -modulus -noout)" = "$(openssl rsa -pubin -in "$RUNNER_TEMP/keys/$KEYNAME.pub" -modulus -noout)" ] \
            || { echo "::error::TSX_APORTS_PRIVKEY does not match $PUB"; exit 1; }
          echo "TSX_APORTS_KEY=$RUNNER_TEMP/keys/$KEYNAME" >> "$GITHUB_ENV"

      - name: Throwaway signing key (a pull request only builds and publishes nothing)
        if: steps.mode.outputs.publish != 'true'
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          openssl genrsa -out "$RUNNER_TEMP/keys/ci-throwaway.rsa" 4096
          openssl rsa -in "$RUNNER_TEMP/keys/ci-throwaway.rsa" -pubout -out "$RUNNER_TEMP/keys/ci-throwaway.rsa.pub"
          echo "TSX_APORTS_KEY=$RUNNER_TEMP/keys/ci-throwaway.rsa" >> "$GITHUB_ENV"

      # The runner has no qemu-user binfmt. If it could not run the containers
      # natively, these commands would fail. The log lines show the host
      # architecture and the architecture of each container.
      - name: Check that the armv7 and aarch64 containers run natively
        run: |
          echo "host $(uname -m), qemu-arm binfmt $([ -e /proc/sys/fs/binfmt_misc/qemu-arm ] && echo registered || echo absent)"
          echo "armv7 container: $(docker run --rm --platform linux/arm/v7 alpine:3.24 apk --print-arch)"
          echo "aarch64 container: $(docker run --rm --platform linux/arm64 alpine:3.24 apk --print-arch)"

      # Start from the published tree. Then the older versions
      # (index.sh --keep 2) and the packages that this run does not rebuild
      # stay after the deploy. The step checks every index against the
      # committed public key.
      - name: Carry forward the published tree
        env:
          SEED_URL: ${{ inputs.seed_url }}
        run: |
          if [ -n "$SEED_URL" ]; then
            scripts/carry-forward.py --seed "$SEED_URL"
          else
            scripts/carry-forward.py --from "$SITE_URL" \
              --fallback-seed "https://github.com/$GITHUB_REPOSITORY/releases/download/seed/tsx-aports-seed.tar.gz"
          fi

      # --skip-existing: the build does not rebuild a published version
      # (tensorflow-lite-c is a long C++ build).
      # --skip-unreachable: the build skips a kernel package whose release
      # bundle does not exist yet, with a warning. Its carried-forward copy
      # stays.
      # --all builds two passes: armv7 (common, xx60) and aarch64 (common).
      # A package builds in a pass only when its arch= lists that
      # architecture. tensorflow-lite-c and sendspin-cli list both.
      - name: Build the new versions
        run: scripts/build.sh --skip-existing --skip-unreachable --all

      - name: Assemble the published tree (latest and one previous version)
        if: steps.mode.outputs.publish == 'true'
        run: |
          scripts/index.sh --keep 2 --out repo
          echo "$SITE_DOMAIN" > repo/CNAME
          # Last check: every index signature and apk checksum in the tree
          # that goes live must verify against the committed key.
          scripts/carry-forward.py --from repo --dest "$RUNNER_TEMP/verify"
          du -sh repo
          find repo -name '*.apk' -exec du -h {} + | sort -rh | head -5

      - uses: actions/upload-pages-artifact@v5
        if: steps.mode.outputs.publish == 'true'
        with:
          path: repo

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # tsx-xx60-wlroots0.20 holds back Alpine's wlroots0.20 on the panels, also
  # its security updates. When Alpine publishes another wlroots0.20 build,
  # open an issue (once for each version). A person then checks the fix and
  # rebases the package, or switches the panels back (README.md).
  wlroots-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the Alpine wlroots0.20 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OURS=$(sed -n 's/^pkgver=//p' xx60/tsx-xx60-wlroots0.20/APKBUILD)-r$(sed -n 's/^pkgrel=//p' xx60/tsx-xx60-wlroots0.20/APKBUILD)
          ALPINE=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.24/community/armv7/APKINDEX.tar.gz \
            | tar -xzO APKINDEX | awk '/^P:wlroots0.20$/{p=1} p&&/^V:/{print substr($0,3); exit}')
          echo "ours=$OURS alpine=$ALPINE"
          if [ -z "$ALPINE" ]; then echo "::error::no wlroots0.20 in the Alpine index"; exit 1; fi
          [ "$OURS" != "$ALPINE" ] || exit 0
          TITLE="wlroots0.20: Alpine has $ALPINE, tsx-xx60-wlroots0.20 is $OURS"
          if [ "$(gh issue list --state all --search "in:title \"$TITLE\"" --json number --jq length)" != 0 ]; then
            echo "an issue for $ALPINE exists already"; exit 0
          fi
          gh issue create --title "$TITLE" --body "Alpine published wlroots0.20 $ALPINE. The panels still run tsx-xx60-wlroots0.20 $OURS, so they do not get the Alpine build.

          1. Find out if $ALPINE has the gamma reset fix (upstream, or as an Alpine patch).
          2. If it has the fix, switch the panels back to the Alpine package (README.md, \"tsx-xx60-wlroots0.20\").
          3. If it does not have the fix, set pkgver and pkgrel of xx60/tsx-xx60-wlroots0.20 to $ALPINE, copy the other changes of the Alpine APKBUILD, and keep the patch."

  chromium-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Check Alpine for a newer chromium build
        id: check
        run: |
          CURRENT=$(sed -n 's/^pkgver=//p' xx60/tsx-xx60-chromium/APKBUILD)-r$(sed -n 's/^pkgrel=//p' xx60/tsx-xx60-chromium/APKBUILD)
          LATEST=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.24/community/armv7/APKINDEX.tar.gz \
            | tar -xzO APKINDEX | awk '/^P:chromium$/{p=1} p&&/^V:/{print substr($0,3); exit}')
          echo "current=$CURRENT latest=$LATEST"
          if [ -z "$LATEST" ]; then echo "::error::no chromium in the Alpine index"; exit 1; fi
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Change the pin
        if: steps.check.outputs.new == 'true'
        env:
          LATEST: ${{ steps.check.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${LATEST%-r*}/; s/^pkgrel=.*/pkgrel=${LATEST##*-r}/" xx60/tsx-xx60-chromium/APKBUILD

      # This run uses a throwaway key. It only proves that the repack works,
      # and it publishes nothing. The merged pull request starts the real build.
      - name: Repack (fails and stops here if the patch site moved)
        if: steps.check.outputs.new == 'true'
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          openssl genrsa -out "$RUNNER_TEMP/keys/ci-throwaway.rsa" 4096
          openssl rsa -in "$RUNNER_TEMP/keys/ci-throwaway.rsa" -pubout -out "$RUNNER_TEMP/keys/ci-throwaway.rsa.pub"
          TSX_APORTS_KEY="$RUNNER_TEMP/keys/ci-throwaway.rsa" scripts/build.sh xx60/tsx-xx60-chromium

      # On success, commit the new pin and open a pull request. Do not push to
      # main directly, so that a person reviews the diff once.
      # patch-chromium.py verified the patch site, so sigs.json already covers
      # it. If it did not, the previous step failed and this step does not run.
      - name: Open a pull request with the new pin
        if: steps.check.outputs.new == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "tsx-xx60-chromium: bump to ${{ steps.check.outputs.version }}"
          commit-message: "tsx-xx60-chromium: bump to ${{ steps.check.outputs.version }}"
          branch: chromium-bump-${{ steps.check.outputs.version }}
          add-paths: xx60/tsx-xx60-chromium/APKBUILD
